# ============================================================================
# U-Boot hardening fragment - AM62x-SK, eMMC-only, FIT-signed, keyed shell
#
# Apply:
#   scripts/kconfig/merge_config.sh -m <your_defconfig> hardening.fragment.config
#   make olddefconfig
#   # then re-check: make menuconfig  (use '/' to search each symbol)
#
# VERIFY every symbol against your TI/Wrynose U-Boot tree. TI forks sometimes
# force-select symbols via `imply`/`select`; confirm with `savedefconfig` and a
# diff of the resulting .config. See Documentation/KNOWN-UNKNOWNS.md.
# ============================================================================

# --- FIT signature enforcement (kernel/DTB/overlays must be signed) ---------
CONFIG_FIT=y
CONFIG_FIT_SIGNATURE=y
CONFIG_RSA=y
# Refuse the legacy (unsigned) uImage format so it cannot be a fallback.
# CONFIG_LEGACY_IMAGE_FORMAT is not set

# --- Kill env/script injection (uEnv.txt import, boot.scr) -------------------
# CONFIG_CMD_IMPORTENV is not set
# CONFIG_CMD_SOURCE is not set

# --- Volatile built-in env only; no persistence, no re-save -----------------
CONFIG_ENV_IS_NOWHERE=y
# CONFIG_ENV_IS_IN_FAT is not set
# CONFIG_ENV_IS_IN_EXT4 is not set
# CONFIG_ENV_IS_IN_MMC is not set
# CONFIG_ENV_IS_IN_SPI_FLASH is not set
# CONFIG_ENV_IS_IN_NAND is not set
# CONFIG_ENV_IS_IN_UBI is not set
# CONFIG_CMD_SAVEENV is not set

# --- Remove BOOTSTD fallback (script/extlinux/efi methods + bootflow) -------
# CONFIG_BOOTMETH_SCRIPT is not set
# CONFIG_BOOTMETH_EXTLINUX is not set
# CONFIG_BOOTMETH_EFI is not set
# CONFIG_CMD_BOOTFLOW is not set
# NOTE: BOOTSTD itself may be select'd by other symbols; if it cannot be
# unset cleanly, removing the methods above + the env `bootflow` call is
# sufficient (there is nothing left for it to boot).

# --- Remove network boot surface (kills the pxe/dhcp boot_targets) ----------
# CONFIG_CMD_NET is not set
# CONFIG_CMD_PXE is not set
# CONFIG_CMD_DHCP is not set
# CONFIG_CMD_BOOTP is not set
# CONFIG_CMD_TFTPBOOT is not set
# NOTE: this removes network *commands*, not the ethernet *driver*. If your
# build has a dependency on CMD_NET, verify it still links.

# --- Remove USB storage boot surface (drop these lines if you need USB) -----
# CONFIG_CMD_USB is not set
# CONFIG_USB_STORAGE is not set

# --- Keep a keyed-stop shell, but protected by an ENCRYPTED stop string ------
# (no plaintext key baked into the image). bootdelay is the key-entry window.
CONFIG_CMDLINE=y
CONFIG_HUSH_PARSER=y
CONFIG_AUTOBOOT=y

# ref: https://ejaaskel.dev/protecting-u-boot-command-line/
# Set short boot delay to have shorter boot times
CONFIG_BOOTDELAY=1
# Allow stopping autoboot with keypress / input string
CONFIG_AUTOBOOT_KEYED=y
# Enable stop string
CONFIG_AUTOBOOT_STOP_STR_ENABLE=y
# Enable password wait on Enter key
CONFIG_AUTOBOOT_NEVER_TIMEOUT=y
# Enable encryption on autoboot stop strings
CONFIG_AUTOBOOT_ENCRYPTION=y
# Enable crypt-hashed passwords
CONFIG_CRYPT_PW=y
# Enable SHA512 for the passwords
CONFIG_CRYPT_PW_SHA512=y
CONFIG_AUTOBOOT_PROMPT="pswd : "
# The stop string
# mkpasswd -m sha-512 -R 10000 xyx
CONFIG_AUTOBOOT_STOP_STR_CRYPT="$6$rounds=10000$YbpQBtKf7.JIUx3B$TdGQrTuiJqQz.fSvxVYGhD6LBY6vXvF4JNZhCQMz1N1616eUl/y/prk39OIPF5Cwrk82wSEW./0nZi/aLL1jv."
# Procedure to stop the autoboot:
# 1. Press Enter as the board boots
# 2. The CONFIG_AUTOBOOT_PROMPT shows
#    - press Enter now
#    - then enter the password
# 3. if !CONFIG_AUTOBOOT_NEVER_TIMEOUT=y 
#       you MUST enter the correct password before the timeout expires! (CONFIG_BOOTDELAY)
#    fi
# 4. If correct you're dropped to the U-Boot shell, else it continues to boot

#CONFIG_AUTOBOOT_KEYED=y
#CONFIG_AUTOBOOT_FLUSH_STDIN=y
#CONFIG_AUTOBOOT_ENCRYPTION=y
#CONFIG_CRYPT_PW=y
#CONFIG_AUTOBOOT_STOP_STR_ENABLE=y
#CONFIG_AUTOBOOT_NEVER_TIMEOUT=y
#CONFIG_AUTOBOOT_STOP_STR_CRYPT="xyx"
#CONFIG_AUTOBOOT_PROMPT="p : "
# VERIFY the expected value format for your version (plain sha256 hex, or
# "salt:hash"); the concatenation/salt handling lives in common/autoboot.c.
#CONFIG_AUTOBOOT_STOP_STR_SHA256="d3b396b60df5"
#CONFIG_AUTOBOOT_STOP_STR_SHA256="REPLACE_WITH_SHA256_OR_SALT:HASH"
#CONFIG_BOOTDELAY=3

# --- Optional further reduction (uncomment for production; breaks debug) -----
# Removes md/mw/cp etc. - the U-Boot analog of /dev/mem write access.
# # CONFIG_CMD_MEMORY is not set
# Audit and drop any other CONFIG_CMD_* you do not need at the prompt.
