#
# This file is your local configuration file and is where all local user settings
# are placed. The comments in this file give some guide to the options a new user
# to the system might want to change but pretty much any configuration option can
# be set in this file. More adventurous users can look at
# local.conf.sample.extended which contains other examples of configuration which
# can be placed in this file but new users likely won't need any of them
# initially. There's also site.conf.sample which contains examples of site specific
# information such as proxy server addresses.
#

# Extra image configuration defaults
#
# The EXTRA_IMAGE_FEATURES variable allows extra packages to be added to the generated
# images. Some of these options are added to certain image types automatically. Some
# of the features available are:
#  "dbg-pkgs"             - add -dbg packages for all installed packages
#                           (adds symbol information for debugging/profiling)
#  "src-pkgs"             - add -src packages for all installed packages
#                           (adds source code for debugging)
#  "dev-pkgs"             - add -dev packages for all installed packages
#                           (useful if you want to develop against libs in the image)
#  "ptest-pkgs"           - add -ptest packages for all ptest-enabled packages
#                           (useful if you want to run the package test suites)
#  "tools-sdk"            - add development tools (gcc, make, pkgconfig etc.)
#  "tools-debug"          - add debugging tools (gdb, strace)
#  "eclipse-debug"        - add Eclipse remote debugging support
#  "tools-profile"        - add profiling tools (oprofile, lttng, valgrind)
#  "tools-testapps"       - add useful testing tools (ts_print, aplay, arecord etc.)
#  "allow-empty-password" - allow users to have an empty password
#  "empty-root-password"  - the root user has no password set
#  "allow-root-login      - the root user can login
# There are other features that can be used here too, see
# meta/classes-recipe/image.bbclass and
# meta/classes-recipe/core-image.bbclass for more details.
#
# The following will allow root login without a password for convenience.
# Use with care, and never in product builds.
#EXTRA_IMAGE_FEATURES ?= "allow-empty-password empty-root-password allow-root-login"

#   - 'buildstats' collect build statistics
USER_CLASSES ?= "buildstats"


#
# Runtime testing of images
#
# The build system can test booting virtual machine images under qemu (an emulator)
# after any root filesystems are created and run tests against those images. It can also
# run tests against any SDK that are built. To enable this uncomment these lines.
# See meta/classes-recipe/test{image,sdk}.bbclass for further details.
IMAGE_CLASSES += "testimage testsdk"
TESTIMAGE_AUTO:qemuall = "1"

#OE_TERMINAL = "auto"
# By default disable interactive patch resolution (tasks will just fail instead):
PATCHRESOLVE = "noop"

#
# Disk Space Monitoring during the build
#
# Monitor the disk space during the build. If there is less that 1GB of space or less
# than 100K inodes in any key build location (TMPDIR, DL_DIR, SSTATE_DIR), gracefully
# shutdown the build. If there is less than 100MB or 1K inodes, perform a hard halt
# of the build. The reason for this is that running completely out of space can corrupt
# files and damages the build in ways which may not be easily recoverable.
# It's necessary to monitor /tmp, if there is no space left the build will fail
# with very exotic errors.
BB_DISKMON_DIRS ??= "\
    STOPTASKS,${TMPDIR},1G,100K \
    STOPTASKS,${DL_DIR},1G,100K \
    STOPTASKS,${SSTATE_DIR},1G,100K \
    STOPTASKS,/tmp,100M,100K \
    HALT,${TMPDIR},100M,1K \
    HALT,${DL_DIR},100M,1K \
    HALT,${SSTATE_DIR},100M,1K \
    HALT,/tmp,10M,1K"

#
# Shared-state files from other locations
#SSTATE_MIRRORS ?= "\
#file://.* https://someserver.tld/share/sstate/PATH;downloadfilename=PATH \
#file://.* file:///some/local/dir/sstate/PATH"

#ASSUME_PROVIDED += "libsdl2-native"

# You can also enable the Gtk UI frontend, which takes somewhat longer to build, but adds
# a handy set of menus for controlling the emulator.
#PACKAGECONFIG:append:pn-qemu-system-native = " gtk+"

#
# Hash Equivalence
#BB_HASHSERVE = "auto"
#BB_SIGNATURE_HANDLER = "OEEquivHash"

#
# Memory Resident Bitbake
#
# Bitbake's server component can stay in memory after the UI for the current command
# has completed. This means subsequent commands can run faster since there is no need
# for bitbake to reload cache files and so on. Number is in seconds, after which the
# server will shut down.
#
#BB_SERVER_TIMEOUT = "60"

# CONF_VERSION is increased each time build/conf/ changes incompatibly and is used to
# track the version of this file when it was generated. This can safely be ignored if
# this doesn't mean anything to you.
CONF_VERSION = "2"


#--------------- Securing the TI SKEVM k3 AM62xx board PROJECT -----------------
MACHINE := "am62xx-evm"
# The TI k3 SoCs do a split-boot: BL1 ROM code tiboot3.bin runs on a 'k35r' core
# while the later BL2 and BL3[123] stages run on the A53 core
# So when building, the 2nd para shows as: MACHINE              = "am62xx-evm-k3r5"

#========== !!! DEV ONLY !!! RM IN PRODUCTION =====================================
EXTRA_IMAGE_FEATURES ?= "allow-empty-password empty-root-password allow-root-login"
#========== !!! DEV ONLY !!! RM IN PRODUCTION =====================================

#IMAGE_INSTALL:append = " u-boot-fw-utils"

#--------- BL U-Boot & FIT images signing -----------------------------
#  ti-secure-dev-pkg: a TI security project that is used to sign binaries in the HS boot flow
TI_SECURE_DEV_PKG = "../upstream_layers/core-secdev-k3"
BB_ENV_PASSTHROUGH_ADDITIONS += "TI_SECURE_DEV_PKG"
export TI_SECURE_DEV_PKG
# Path to our signing key
SYSFW_SIGN_KEY    = "${TOPDIR}/custMpk.pem"
TI_SIGNING_KEY    = "${TOPDIR}/custMpk.pem"

#--- apparently worked on older Yocto only; now results in a fail
# New Yocto TI system: am62xx-evm resolves through k3.inc, so your signed
# kernel FIT is already produced — by the ti-kernel-fitimage recipe
# (which requires oe-core's linux-yocto-fitimage.bb → kernel-fit-image.bbclass),
# pulled in by the machine, entirely independent of your local.conf.
# New model = the kernel just builds a plain Image; a separate recipe pulls that
# artifact from sstate and assembles+signs the FIT as its own build product.
# So commenting them out... 
#KERNEL_CLASSES += "kernel-fitimage"   # line 274 — class gone → the ParseError
#KERNEL_IMAGETYPES += "fitImage"       # line 275 — rejected now
#---

#--- U-Boot
#UBOOT_SIGN_ENABLE     = "1"
UBOOT_SIGN_KEYDIR     = "${TOPDIR}/keys"
UBOOT_SIGN_KEYNAME    = "dev"
UBOOT_MKIMAGE_DTCOPTS = "-I dts -O dtb -p 2000"
FIT_SIGN_ALG          = "rsa4096"
FIT_HASH_ALG          = "sha512"

# We copy the 2nd (rootfs) partition /boot/fitImage file to the /boot
# FAT partition so that we don't need to give U-Boot EROFS support
IMAGE_BOOT_FILES:append = " fitImage"
#----------------------------------------------------------------------

# Kernel image
#KERNEL_DEVICETREE = "fdt-k3-am625-sk.dtb"

#require conf/distro/include/security_flags.inc
ERROR_QA:remove = "patch-status"
# Was getting this err:
# ERROR: ti-kernel-fitimage-1.0-r0 do_packagedata: QA Issue: Package version for package ti-kernel-fitimage-src went backwards which would break package feeds (from 0:6.18.38-ti-00934-g8933766be737-dirty-r0 to 0:6.18.38-k1-ti-00934-g8933766be737-dirty-r0) [version-going-backwards]
ERROR_QA:remove = "version-going-backwards"
WARN_QA:append = " version-going-backwards"


#--- RO rootfs
# simple- just set mount option to 'ro'
EXTRA_IMAGE_FEATURES:append = " read-only-rootfs "
# set rootfs as a true RO fs - EROFS!
IMAGE_FSTYPES:append = " erofs"
WKS_FILE = "${TOPDIR}/../myprj_layers/meta-bsp/wic/my-sdimage-2part.wks"
# Ensure the host tool is built to pack the image
IMAGE_TYPEDEP:wic += "erofs"
#---

#--- dm-verity on the rootfs for Integrity checking
# src: https://ejaaskel.dev/yocto-hardening-dm-verity/
# uses meta-security layer
DISTRO_FEATURES:append = " security"
require conf/distro/include/security_flags.inc
# above- already in ../upstream_layers/openembedded-core/meta/conf/distro/defaultsetup.conf

# To avoid several dependency loops:
# meta-bsp/recipes-core/packagegroups/packagegroup-core-boot.bbappend
# dtl: refer the 'SecureBoot_on_TI_SK_AM62x_HSFS.pdf' section 'Adding integrity
# protection with dm-verity to the RO root filesystem'
RDEPENDS:${PN}:remove = "ti-kernel-fitimage"

# This mechanism stores the root hash in initramfs, and initramfs prepares verity,
# so we need an initramfs image
INITRAMFS_IMAGE = "dm-verity-image-initramfs"
# The name of the image you want to
# integrity check with dm-verity
DM_VERITY_IMAGE = "core-image-minimal"
# Type of the image, important for finding
# the artifacts during hash tree calculation
DM_VERITY_IMAGE_TYPE = "erofs"
# This actually enables the verity tasks for the image
IMAGE_CLASSES:append = " dm-verity-img "
INITRAMFS_IMAGE_BUNDLE = "0"
# Required for the variables in Wic file to expand correctly
WICVARS:append = " DM_VERITY_IMAGE DM_VERITY_IMAGE_TYPE IMAGE_NAME_SUFFIX"
# If using kernel recipe other than linux-yocto, add this as well
KERNEL_FEATURES:append = " features/device-mapper/dm-verity.scc"
#---

# rm unreqd serial console
SERIAL_CONSOLES:remove:am62xx-evm = "115200;ttyS3"

# Remove unneeded packages for security
BAD_RECOMMENDATIONS += "packagegroup-core-debug"
# console image only
DISTRO_FEATURES:remove = "wayland x11"

#--- Security: checking for known vulns + CVEs
# see https://docs.yoctoproject.org/security-manual/vulnerabilities.html
##INHERIT += "cve-check"  # old way
#INHERIT += "vex"  # modern -or- += "sbom-cve-check"
#OE_FRAGMENTS += "core/yocto/sbom-cve-check"
#include conf/distro/include/cve-extra-exclusions.inc
#---

INHERIT += "buildhistory"

